<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Putri Bali POS</title><meta name="robots" content="noindex">
<script>
/* GitHub Pages: alamat seperti /EMAS-POS/arsiptransaksi (huruf apa pun) diarahkan ke halaman Arsip di aplikasi. */
(function(){
  var p = location.pathname, m = p.match(/^(.*?\/)arsip[^\/]*\/?$/i);
  if (m) return location.replace(m[1] + '#arsip');
  var seg = p.split('/').filter(Boolean);
  location.replace('/' + (seg.length && location.hostname.indexOf('github.io') > -1 ? seg[0] + '/' : ''));
})();
</script>
